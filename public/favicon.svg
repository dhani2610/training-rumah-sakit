  <!-- Hospital Medical Shield -->
  <path d="M50 14 L82 28 V52 C82 72 50 87 50 87 C50 87 18 72 18 52 V28 Z" fill="url(#shieldGrad)" stroke="#facc15" stroke-width="2"/>
  
  <!-- Medical Cross Accent in Yellow -->
  <rect x="42" y="30" width="16" height="40" rx="5" fill="url(#goldGrad)"/>
  <rect x="30" y="42" width="40" height="16" rx="5" fill="url(#goldGrad)"/>
